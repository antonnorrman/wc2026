  .auth-logo{text-align:center;margin-bottom:2.5rem}
  .auth-logo h1{font-family:var(--font-serif);font-size:2.6rem;font-weight:400;color:var(--ink);letter-spacing:-0.5px;line-height:1.15}

  .auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
  .auth-tab{flex:1;padding:10px;text-align:center;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
  .auth-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
  .field{margin-bottom:1.25rem}
  .field label{display:block;font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;background:var(--white);border:1px solid var(--border2);border-radius:var(--r);color:var(--ink);font-family:var(--font-sans);font-size:14px;outline:none;transition:border .15s}

  .btn{width:100%;padding:11px;background:var(--ink);border:1px solid var(--ink);border-radius:var(--r);color:var(--white);font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}

  .btn-outline{background:transparent;color:var(--ink)}.btn-outline:hover{background:var(--ink);color:var(--white)}
  .btn-green{background:var(--green);border-color:var(--green)}.btn-green:hover{background:var(--green-light);border-color:var(--green-light)}
  .btn-sm{width:auto;padding:7px 14px;font-size:11px}
  .error-msg{background:#fdf0f0;border:1px solid #e8c5c4;color:var(--red);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:1rem}
  .success-msg{background:#f0f7f3;border:1px solid #b8d9c8;color:var(--green);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:1rem}

  /* Nav */
  .nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
  .nav-logo{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;color:var(--ink);letter-spacing:-.3px}
  .nav-links{display:flex}
  .nav-link{padding:0 14px;height:60px;display:flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--ink3);border-bottom:2px solid transparent;transition:all .15s}
  .nav-link:hover{color:var(--ink)}.nav-link.active{color:var(--ink);border-bottom-color:var(--ink)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .nav-user{font-size:12px;color:var(--ink3)}
  .nav-signout{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--ink3);padding:6px 12px;border-radius:var(--r);transition:all .15s}

  .stat-label{font-size:10px;font-weight:600;color:var(--ink4);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
  .stat-value{font-family:var(--font-serif);font-size:1.9rem;font-weight:400;color:var(--ink);line-height:1}

  .spec-grid th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--ink4);padding:8px 10px;border-bottom:1px solid var(--border);background:var(--cream)}
  .spec-grid td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink2)}

  .save-bar{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--border);padding:.875rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}

  .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .badge-green{background:#e8f4ee;color:var(--green)}

  .section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink4);margin-bottom:.75rem}
  .scoring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
  .scoring-card{background:var(--white);padding:1.25rem 1.5rem}
  .scoring-card-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--ink4);margin-bottom:8px}
  .scoring-card-body{font-size:13px;color:var(--ink2);line-height:1.8}
  .admin-match{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
  .admin-match.has-result{border-color:#b8d9c8;background:#fafdf9}
  .admin-team{flex:1;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
  .admin-team.away{justify-content:flex-end}
  .loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--ink3);font-size:13px}
  select{appearance:none}
</style>

// Maps R32 match numbers to their slot key in FIFA_R32_LOOKUP
const R32_THIRD_PLACE_MATCHES = {
  74: 'M74', 77: 'M77', 79: 'M79', 80: 'M80',
  81: 'M81', 82: 'M82', 85: 'M85', 87: 'M87'
};

// New resolveSlot using lookup table
function resolveSlotFromLookup(matchNum, qualifyingGroups, standings) {
  const key = [...qualifyingGroups].sort().join('');
  const scenario = FIFA_R32_LOOKUP[key];
  if (!scenario) return null;
  const slotKey = R32_THIRD_PLACE_MATCHES[matchNum];
  if (!slotKey) return null;
  const groupLetter = scenario[slotKey];
  if (!groupLetter) return null;
  return standings[groupLetter]?.[2]?.id || null;
}

// Resolve a slot to a team ID given standings
function resolveSlot(slot, standings, best8thirds) {
  if (slot.type === 'winner') return standings[slot.g]?.[0]?.id || null;
  if (slot.type === 'runner-up') return standings[slot.g]?.[1]?.id || null;
  if (slot.type === '3rd') {
    // Find the best 3rd place team from the eligible cluster groups
    // that is in the best8thirds list - pick the highest ranked one
    const eligible = slot.cluster.split('/');
    // Find all 3rd place teams from eligible groups that qualified
    const candidates = best8thirds.filter(t =>
      eligible.some(g => standings[g]?.[2]?.id === t)
    );
    // Return the first one (best8thirds is already sorted by ranking)
    return candidates[0] || null;
  }
  return null;
}

// Legacy R32_BRACKET kept for scoring engine compatibility
const R32_BRACKET = R32_FIXED.map(([a,b]) => [
  {g:a.g||'A', p:a.type==='winner'?1:a.type==='runner-up'?2:3},
  {g:b.g||'A', p:b.type==='winner'?1:b.type==='runner-up'?2:3},
]);

function calcStandings(teamIds,matches,scoreMap){
  const table={};
  teamIds.forEach(id=>{table[id]={pts:0,gf:0,ga:0,gd:0,played:0};});
  matches.forEach(m=>{
    const s=scoreMap[m.id];
    if(!s||s.home===''||s.away===''||s.home==null||s.away==null)return;
    const hg=parseInt(s.home),ag=parseInt(s.away),h=m.home_team_id,a=m.away_team_id;
    if(!table[h]||!table[a])return;
    table[h].gf+=hg;table[h].ga+=ag;table[h].gd+=hg-ag;table[h].played++;
    table[a].gf+=ag;table[a].ga+=hg;table[a].gd+=ag-hg;table[a].played++;
    if(hg>ag)table[h].pts+=3;else if(hg<ag)table[a].pts+=3;else{table[h].pts+=1;table[a].pts+=1;}
  });
  return Object.entries(table).sort((a,b)=>b[1].pts-a[1].pts||b[1].gd-a[1].gd||b[1].gf-a[1].gf).map(([id,s])=>({id:parseInt(id),...s}));
}

function deriveR32Teams(allTeams,groupMatches,predScores){
  const groupTeams={};
  allTeams.forEach(t=>{if(!groupTeams[t.group_id])groupTeams[t.group_id]=[];groupTeams[t.group_id].push(t.id);});
  const standings={};
  GROUPS.forEach(g=>{standings[g]=calcStandings(groupTeams[g]||[],groupMatches.filter(m=>m.group_id===g),predScores);});
  const allThirds=GROUPS.map(g=>standings[g][2]).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  const best8=allThirds.slice(0,8).map(t=>t.id);
  const posMap={};
  GROUPS.forEach(g=>{standings[g].forEach((t,i)=>{posMap[g+'_'+(i+1)]=t.id;});});
  // Map each group to its 3rd place team (only for groups that produced a best-8 third)
  const thirdSlots={};
  GROUPS.forEach(g=>{
    const third=standings[g]?.[2];
    if(third&&best8.includes(third.id))thirdSlots[g]=third.id;
  });
  return{posMap,thirdSlots,standings,best8thirds:best8};
}

function getR32Team(slot,posMap,thirdSlots){
  if(slot.p===3)return thirdSlots[slot.g]||null;
  return posMap[slot.g+'_'+slot.p]||null;
}

async function recalcAllScores(){
  const [{data:allMatches},{data:allTeams},{data:allPredictions},{data:allKoPreds},{data:allSpecials},{data:allProfiles},{data:allAwards}]=await Promise.all([
    sb.from('matches').select('*').order('match_number'),
    sb.from('teams').select('*'),
    sb.from('predictions').select('*'),
    sb.from('knockout_predictions').select('*'),
    sb.from('special_predictions').select('*'),
    sb.from('profiles').select('id'),
    sb.from('special_awards').select('*'),
  ]);
  const groupMatches=allMatches.filter(m=>m.stage==='group');
  const knockoutMatches=allMatches.filter(m=>m.stage!=='group');
  const actualGroupScores={};
  groupMatches.forEach(m=>{if(m.actual_home_goals!=null&&m.actual_away_goals!=null)actualGroupScores[m.id]={home:m.actual_home_goals,away:m.actual_away_goals};});
  const actualKoTeams={};
  knockoutMatches.forEach(m=>{if(!actualKoTeams[m.stage])actualKoTeams[m.stage]=new Set();if(m.actual_home_team_id)actualKoTeams[m.stage].add(m.actual_home_team_id);if(m.actual_away_team_id)actualKoTeams[m.stage].add(m.actual_away_team_id);});
  const scoreUpdates=[];
  for(const profile of allProfiles){
    const uid=profile.id;
    const userGroupPreds=allPredictions.filter(p=>p.user_id===uid);
    const userPredMap={};
    userGroupPreds.forEach(p=>{userPredMap[p.match_id]={home:p.predicted_home_goals,away:p.predicted_away_goals};});
    let groupPts=0;
    userGroupPreds.forEach(pred=>{
      const actual=actualGroupScores[pred.match_id];if(!actual)return;
      if(pred.predicted_home_goals===actual.home&&pred.predicted_away_goals===actual.away){groupPts+=3;return;}
      const pr=pred.predicted_home_goals>pred.predicted_away_goals?'H':pred.predicted_home_goals<pred.predicted_away_goals?'A':'D';
      const ar=actual.home>actual.away?'H':actual.home<actual.away?'A':'D';
      if(pr===ar)groupPts+=1;
    });
    let knockoutPts=0;
    const userKoMap={};
    allKoPreds.filter(p=>p.user_id===uid).forEach(p=>{userKoMap[p.match_id]=p.predicted_winner_id;});
    const{posMap,thirdSlots}=deriveR32Teams(allTeams,groupMatches,userPredMap);
    // R32: derive actual teams from group results automatically
    const allGroupResultsIn = groupMatches.every(m =>
      m.actual_home_goals != null && m.actual_away_goals != null
    );
    if(allGroupResultsIn) {
      const R32_IDX_MNUM_SCORING={1:74,4:77,6:79,7:80,8:81,9:82,12:85,14:87};
      // Actual R32 teams from real group results
      const actualGroupScoresMap = {};
      groupMatches.forEach(m=>{actualGroupScoresMap[m.id]={home:m.actual_home_goals,away:m.actual_away_goals};});
      const {standings:actualSt} = deriveR32Teams(allTeams,groupMatches,actualGroupScoresMap);
      const best8actual = GROUPS.map(g=>actualSt[g]?.[2]).filter(Boolean)
        .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8).map(t=>t.id);
      const qualActual = GROUPS.filter(g=>actualSt[g]?.[2]&&best8actual.includes(actualSt[g][2].id));
      const actualR32Teams = new Set();
      R32_FIXED.forEach(([slotA,slotB],idx)=>{
        const mn=R32_IDX_MNUM_SCORING[idx];
        const tA=slotA.type==='3rd'?(mn?resolveSlotFromLookup(mn,qualActual,actualSt):null):resolveSlot(slotA,actualSt,best8actual);
        const tB=slotB.type==='3rd'?(mn?resolveSlotFromLookup(mn,qualActual,actualSt):null):resolveSlot(slotB,actualSt,best8actual);

        const tB=slotB.type==='3rd'?(mn?resolveSlotFromLookup(mn,qualUser,userSt):null):resolveSlot(slotB,userSt,best8user);
        if(tA&&actualR32Teams.has(tA)){knockoutPts+=STAGE_PTS['r32'];r32pts++;}

    // Build user's predicted bracket progression

      const {standings:uSt}=deriveR32Teams(allTeams,groupMatches,userPredMap);
      const b8u=GROUPS.map(g=>uSt[g]?.[2]).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8).map(t=>t.id);

      const IDX_MN={1:74,4:77,6:79,7:80,8:81,9:82,12:85,14:87};
      const ur32=R32_FIXED.map(([sA,sB],i)=>{
        const mn=IDX_MN[i];
        const h=sA.type==='3rd'?(mn?resolveSlotFromLookup(mn,qGu,uSt):null):resolveSlot(sA,uSt,b8u);
        const a=sB.type==='3rd'?(mn?resolveSlotFromLookup(mn,qGu,uSt):null):resolveSlot(sB,uSt,b8u);
        return{matchId:r32Ms[i]?.id,home:h,away:a};
      });
      const ur16=r16Ms.map((m,i)=>{const a=ur32[i*2],b=ur32[i*2+1];return{matchId:m.id,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
      const uqf=qfMs.map((m,i)=>{const a=ur16[i*2],b=ur16[i*2+1];return{matchId:m.id,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
      const usf=sfMs.map((m,i)=>{const a=uqf[i*2],b=uqf[i*2+1];return{matchId:m.id,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
      const ufin=finMs.map((m,i)=>{const a=usf[i*2],b=usf[i*2+1];return{matchId:m.id,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
      // For each stage, get user's predicted teams entering that stage
      const userTeamsForStage={
        r16:new Set([...ur16.flatMap(m=>[m.home,m.away]).filter(Boolean)]),
        qf:new Set([...uqf.flatMap(m=>[m.home,m.away]).filter(Boolean)]),
        sf:new Set([...usf.flatMap(m=>[m.home,m.away]).filter(Boolean)]),
        final:new Set([...ufin.flatMap(m=>[m.home,m.away]).filter(Boolean)]),
      };
      ['r16','qf','sf','final'].forEach(stage=>{
        const actual=actualKoTeams[stage]||new Set();if(actual.size===0)return;
        const pts=STAGE_PTS[stage];
        userTeamsForStage[stage].forEach(t=>{if(actual.has(t))knockoutPts+=pts;});
      });
    }
    let specialPts=0;
    const specials=allSpecials.find(s=>s.user_id===uid);
    if(specials){
      const finalMatch=allMatches.find(m=>m.stage==='final');
      if(finalMatch&&finalMatch.actual_home_goals!=null&&finalMatch.actual_home_team_id&&finalMatch.actual_away_team_id){
        const winner=finalMatch.actual_home_goals>finalMatch.actual_away_goals?finalMatch.actual_home_team_id:finalMatch.actual_away_team_id;
        if(specials.champion_team_id===winner)specialPts+=10;
      }
      // Total goals is a tiebreaker only - no points awarded
      const topScorerAward=(allAwards||[]).find(a=>a.user_id===uid&&a.category==='top_scorer'&&a.awarded);
      if(topScorerAward)specialPts+=10;
      const topAssistAward=(allAwards||[]).find(a=>a.user_id===uid&&a.category==='top_assister'&&a.awarded);
      if(topAssistAward)specialPts+=10;
    }
    scoreUpdates.push({user_id:uid,group_stage_points:groupPts,knockout_points:knockoutPts,special_points:specialPts,total_points:groupPts+knockoutPts+specialPts,last_updated:new Date().toISOString()});
  }
  await sb.from('scores').upsert(scoreUpdates,{onConflict:'user_id'});
  return scoreUpdates.length;
}

function Countdown(){
  const DEADLINE_MS=new Date('2026-06-10T21:59:00Z').getTime();
  const[timeLeft,setTimeLeft]=useState(null);
  const[expired,setExpired]=useState(false);
  useEffect(()=>{
    const calc=()=>{
      const diff=DEADLINE_MS-Date.now();
      if(diff<=0){setExpired(true);setTimeLeft(null);return;}
      setTimeLeft({d:Math.floor(diff/86400000),h:Math.floor((diff%86400000)/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000)});
    };
    calc();
    const id=setInterval(calc,1000);
    return()=>clearInterval(id);
  },[]);
  if(expired)return(
    <div style={{background:'#fef9ec',border:'1px solid #f0dfa0',borderRadius:'var(--rl)',padding:'1.25rem 2rem',marginBottom:'2rem',display:'flex',alignItems:'center',gap:12}}>
      <div style={{fontFamily:'var(--font-serif)',fontSize:'1.2rem',fontWeight:500,color:'#7a6200'}}>Predictions Locked</div>
      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'1.2px',color:'#b89a00'}}>The deadline has passed</div>
    </div>
  );
  if(!timeLeft)return null;
  return(
    <div style={{display:'flex',gap:1,background:'var(--border)',border:'1px solid var(--border)',borderRadius:'var(--rl)',overflow:'hidden',marginBottom:'2rem',width:'fit-content'}}>
      {[{v:timeLeft.d,l:'Days'},{v:timeLeft.h,l:'Hours'},{v:timeLeft.m,l:'Minutes'},{v:timeLeft.s,l:'Seconds'}].map(({v,l})=>(
        <div key={l} style={{background:'var(--white)',padding:'1rem 1.5rem',textAlign:'center',minWidth:90}}>
          <div style={{fontFamily:'var(--font-serif)',fontSize:'2rem',fontWeight:400,color:'var(--ink)',lineHeight:1}}>{String(v).padStart(2,'0')}</div>
          <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)',marginTop:4}}>{l}</div>
        </div>
      ))}
    </div>
  );
}

function GroupPredictions({session,locked,onScoresChange}){
  const[matches,setMatches]=useState([]);
  const[teams,setTeams]=useState({});
  const[scores,setScores]=useState({});
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  useEffect(()=>{
    Promise.all([
      sb.from('matches').select('*').eq('stage','group').order('match_number'),
      sb.from('teams').select('*'),
      sb.from('predictions').select('*').eq('user_id',session.user.id),
    ]).then(([{data:m},{data:t},{data:p}])=>{
      setMatches(m||[]);
      const tMap={};(t||[]).forEach(team=>tMap[team.id]=team);setTeams(tMap);
      const sMap={};(p||[]).forEach(pred=>{sMap[pred.match_id]={home:pred.predicted_home_goals??'',away:pred.predicted_away_goals??''};});
      setScores(sMap);if(onScoresChange)onScoresChange(sMap);setLoading(false);
    });
  },[session]);
  const update=(matchId,side,val)=>{
    if(locked)return;
    const v=val===''?'':Math.max(0,parseInt(val)||0);
    setScores(s=>{const next={...s,[matchId]:{...s[matchId],[side]:v}};if(onScoresChange)onScoresChange(next);return next;});
  };
  const save=async()=>{
    setSaving(true);
    const upserts=matches.filter(m=>scores[m.id]?.home!==''&&scores[m.id]?.away!==''&&scores[m.id]?.home!=null&&scores[m.id]?.away!=null)
      .map(m=>({user_id:session.user.id,match_id:m.id,predicted_home_goals:scores[m.id].home,predicted_away_goals:scores[m.id].away}));
    await sb.from('predictions').upsert(upserts,{onConflict:'user_id,match_id'});
    setSaved(true);setTimeout(()=>setSaved(false),3000);setSaving(false);
  };
  const clearAll=async()=>{
    if(!window.confirm('Clear all 72 group stage predictions? This cannot be undone.'))return;
    // Delete each prediction individually to avoid RLS issues
    const ids=matches.map(m=>m.id);
    const{error}=await sb.from('predictions').delete().eq('user_id',session.user.id).in('match_id',ids);
    console.log('Clear group result:',error);
    // Reset local state regardless
    const empty={};
    matches.forEach(m=>{empty[m.id]={home:'',away:''};});
    setScores(empty);
    if(onScoresChange)onScoresChange(empty);
    setSaved(false);
  };
  if(loading)return <div className="loading">Loading...</div>;
  const byGroup={};
  matches.forEach(m=>{if(!byGroup[m.group_id])byGroup[m.group_id]=[];byGroup[m.group_id].push(m);});
  const groupTeams={};
  Object.values(teams).forEach(t=>{if(!groupTeams[t.group_id])groupTeams[t.group_id]=[];groupTeams[t.group_id].push(t.id);});
  const filled=matches.filter(m=>scores[m.id]?.home!==''&&scores[m.id]?.away!==''&&scores[m.id]?.home!=null&&scores[m.id]?.away!=null).length;
  return(
    <div>
      <div className="info-box"><p>Predict the score for all 72 group stage matches. Your implied group standings are shown live to the right as you fill in scores. ({filled}/72 completed)</p></div>
      {GROUPS.map(g=>(
        <div key={g} className="group-section">
          <div className="group-title">Group {g}</div>
          <div className="group-layout">
            <div className="group-matches">
              {(byGroup[g]||[]).map(m=>{
                const home=teams[m.home_team_id],away=teams[m.away_team_id];
                const sched=MATCH_SCHEDULE[m.match_number]||{};
                return(
                  <div key={m.id} style={{borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:2}}>
                    <div style={{textAlign:'center',fontSize:10,color:'var(--ink4)',padding:'6px 0 4px',letterSpacing:'.3px'}}>
                      {sched.date} · {sched.cet} CET / {sched.gmt} GMT · <span style={{color:'var(--ink4)'}}>{sched.venue?.split(',')[0]}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div className="match-team" style={{flex:1}}><Flag name={home?.name}/><span>{home?.name}</span></div>
                      <input className="score-input" type="number" min="0" max="20" value={scores[m.id]?.home??''} onChange={e=>update(m.id,'home',e.target.value)} placeholder="0" disabled={locked}/>
                      <span className="match-vs">–</span>
                      <input className="score-input" type="number" min="0" max="20" value={scores[m.id]?.away??''} onChange={e=>update(m.id,'away',e.target.value)} placeholder="0" disabled={locked}/>
                      <div className="match-team away" style={{flex:1}}><Flag name={away?.name}/><span>{away?.name}</span></div>
                    </div>
                  </div>
                );
              })}
            </div>
            <GroupStandingsPanel teamMap={teams} groupId={g} groupTeamIds={groupTeams[g]||[]} groupMatches={byGroup[g]||[]} scoreMap={scores}/>
          </div>
        </div>
      ))}
      {!locked&&(
        <div className="save-bar">
          <p>{filled}/72 matches predicted {saved&&<span style={{color:'var(--green)'}}>· Saved</span>}</p>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sm btn-outline" onClick={clearAll}>Clear</button>
            <button className="btn btn-sm" onClick={save} disabled={saving}>{saving?'Saving...':'Save'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function KnockoutPredictions({session,locked}){
  const[allTeams,setAllTeams]=useState([]);
  const[groupMatches,setGroupMatches]=useState([]);
  const[koMatches,setKoMatches]=useState([]);
  const[groupPredScores,setGroupPredScores]=useState({});
  const[koPicks,setKoPicks]=useState({});
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  useEffect(()=>{
    Promise.all([
      sb.from('teams').select('*'),
      sb.from('matches').select('*').eq('stage','group').order('match_number'),
      sb.from('matches').select('*').neq('stage','group').order('match_number'),
      sb.from('predictions').select('*').eq('user_id',session.user.id),
      sb.from('knockout_predictions').select('*').eq('user_id',session.user.id),
    ]).then(([{data:t},{data:gm},{data:km},{data:gp},{data:kp}])=>{
      setAllTeams(t||[]);setGroupMatches(gm||[]);setKoMatches(km||[]);
      const sMap={};(gp||[]).forEach(p=>{sMap[p.match_id]={home:p.predicted_home_goals,away:p.predicted_away_goals};});
      setGroupPredScores(sMap);
      const kMap={};(kp||[]).forEach(p=>{kMap[p.match_id]=p.predicted_winner_id;});
      setKoPicks(kMap);setLoading(false);
    });
  },[session]);
  const teamMap=useMemo(()=>{const m={};allTeams.forEach(t=>m[t.id]=t);return m;},[allTeams]);
  const{posMap,thirdSlots,standings,best8thirds}=useMemo(()=>{
    if(!allTeams.length||!groupMatches.length)return{posMap:{},thirdSlots:{},standings:{},best8thirds:[]};
    return deriveR32Teams(allTeams,groupMatches,groupPredScores);
  },[allTeams,groupMatches,groupPredScores]);
  const groupFilled=useMemo(()=>groupMatches.filter(m=>groupPredScores[m.id]?.home!=null&&groupPredScores[m.id]?.away!=null).length,[groupMatches,groupPredScores]);
  const r32TeamPairs=useMemo(()=>{
    if(groupFilled<72)return R32_FIXED.map(([a,b])=>({home:null,away:null,homeLabel:a.label,awayLabel:b.label}));
    // Use FIFA Annex C lookup table for 3rd place assignments
    const qualifyingGroups=GROUPS.filter(g=>standings[g]?.[2]&&best8thirds.includes(standings[g][2].id));
    const R32_IDX_TO_MATCHNUM={1:74,4:77,6:79,7:80,8:81,9:82,12:85,14:87};
    return R32_FIXED.map(([slotA,slotB],idx)=>{
      const resolve=(slot)=>{
        if(slot.type!=='3rd')return resolveSlot(slot,standings,best8thirds);
        const matchNum=R32_IDX_TO_MATCHNUM[idx];
        if(!matchNum)return null;
        return resolveSlotFromLookup(matchNum,qualifyingGroups,standings);
      };
      return{home:resolve(slotA),away:resolve(slotB),homeLabel:slotA.label,awayLabel:slotB.label};
    });
  },[standings,best8thirds,groupFilled]);
  const derivedRounds=useMemo(()=>{
    const r32M=koMatches.filter(m=>m.stage==='r32');
    const r16M=koMatches.filter(m=>m.stage==='r16');
    const qfM=koMatches.filter(m=>m.stage==='qf');
    const sfM=koMatches.filter(m=>m.stage==='sf');
    const finM=koMatches.filter(m=>m.stage==='final');
    const gw=(matchId,homeId,awayId)=>{const p=koPicks[matchId];return p===homeId?homeId:p===awayId?awayId:null;};
    const r32=r32M.map((m,i)=>({matchId:m.id,matchNum:m.match_number,home:r32TeamPairs[i]?.home||null,away:r32TeamPairs[i]?.away||null,homeSrc:null,awaySrc:null,homeLabel:r32TeamPairs[i]?.homeLabel,awayLabel:r32TeamPairs[i]?.awayLabel}));
    const r16=r16M.map((m,i)=>{const a=r32[i*2],b=r32[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null,homeSrc:a?.matchNum,awaySrc:b?.matchNum,homeLabel:null,awayLabel:null};});
    const qf=qfM.map((m,i)=>{const a=r16[i*2],b=r16[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null,homeSrc:a?.matchNum,awaySrc:b?.matchNum};});
    const sf=sfM.map((m,i)=>{const a=qf[i*2],b=qf[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null,homeSrc:a?.matchNum,awaySrc:b?.matchNum};});
    const fin=finM.map((m,i)=>{const a=sf[i*2],b=sf[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null,homeSrc:a?.matchNum,awaySrc:b?.matchNum};});
    return{r32,r16,qf,sf,final:fin};
  },[koMatches,r32TeamPairs,koPicks]);
  const pickWinner=(matchId,teamId)=>{
    if(locked)return;
    setKoPicks(p=>({...p,[matchId]:p[matchId]===teamId?null:teamId}));
  };
  const save=async()=>{
    setSaving(true);
    const upserts=Object.entries(koPicks).filter(([,v])=>v!=null).map(([matchId,winnerId])=>({user_id:session.user.id,match_id:parseInt(matchId),predicted_winner_id:winnerId}));
    if(upserts.length>0)await sb.from('knockout_predictions').upsert(upserts,{onConflict:'user_id,match_id'});
    setSaved(true);setTimeout(()=>setSaved(false),3000);setSaving(false);
  };
  const clearKo=async()=>{
    if(!window.confirm('Clear all knockout picks? This cannot be undone.'))return;
    const ids=koMatches.map(m=>m.id);
    const{error}=await sb.from('knockout_predictions').delete().eq('user_id',session.user.id).in('match_id',ids);
    console.log('Clear KO result:',error);
    setKoPicks({});
    setSaved(false);
  };
  if(loading)return <div className="loading">Loading bracket...</div>;


  const rounds=[
    {key:'r32',label:'Round of 32',pts:2,matches:derivedRounds.r32},
    {key:'r16',label:'Round of 16',pts:4,matches:derivedRounds.r16},
    {key:'qf',label:'Quarter Finals',pts:6,matches:derivedRounds.qf},
    {key:'sf',label:'Semi Finals',pts:8,matches:derivedRounds.sf},
    {key:'final',label:'Final',pts:10,matches:derivedRounds.final},
  ];

  return(
    <div>
      <div className="info-box" style={{marginBottom:'1.5rem'}}><p>Click a team to pick them as the winner — they advance to the next round automatically. Your Round of 32 is generated from your group stage predictions.</p></div>
      <div className="bracket-wrap">
        <div className="bracket-tree">
          {rounds.map(({key,label,pts,matches})=>(
            <div key={key} className="bracket-col">
              <div className="bracket-col-header">{label} <span className="bracket-col-pts">({pts}p)</span></div>
              {matches.map(({matchId,matchNum,home,away,homeSrc,awaySrc,homeLabel,awayLabel})=>{
                const homeTeam=home?teamMap[home]:null;
                const awayTeam=away?teamMap[away]:null;
                const picked=koPicks[matchId];
                const bothKnown=!!home&&!!away;
                const sched=KO_SCHEDULE[matchNum]||{};
                return(
                  <div key={matchId} className="bracket-match-wrap">
                    <div className="bracket-match">
                      {sched.date&&<div className="bracket-match-label">Game {matchNum} · {sched.date} · {sched.cet} CET</div>}
                      {[[homeTeam,home,homeSrc,homeLabel],[awayTeam,away,awaySrc,awayLabel]].map(([team,id,src,label],ti)=>(
                        <div key={ti} className={`bracket-team${!team?' tbd':''}${picked===id?' selected':''}${locked||!bothKnown?' disabled':''}`}
                          onClick={()=>bothKnown&&!locked&&pickWinner(matchId,id)}>
                          <span className="bracket-flag"><Flag name={team?.name} size={16}/></span>
                          <span className="bracket-name" style={{color:!team?'var(--ink4)':undefined,fontStyle:!team?'italic':undefined,fontSize:!team&&(label||src)?'10px':undefined}}>{team?team.name:label||(src?`Winner of Game ${src}`:'TBD')}</span>
                          {picked===id&&<span className="bracket-winner-badge">✓</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
      {!locked&&(
        <div className="save-bar">
          <p>{Object.values(koPicks).filter(Boolean).length} knockout picks made {saved&&<span style={{color:'var(--green)'}}>· Saved</span>}</p>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sm btn-outline" onClick={clearKo}>Clear</button>
            <button className="btn btn-sm" onClick={save} disabled={saving}>{saving?'Saving...':'Save'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function GoalsTally({session,scores}){
  // Calculate tally from live scores state passed from parent
  const tally = useMemo(()=>{
    if(scores){
      // Use live state from GroupPredictions
      const entries=Object.values(scores).filter(s=>s.home!==''&&s.away!==''&&s.home!=null&&s.away!=null);
      const total=entries.reduce((s,p)=>{const h=parseInt(p.home),a=parseInt(p.away);return s+(isNaN(h)?0:h)+(isNaN(a)?0:a);},0);
      return{total,count:entries.length};
    }
    return null;
  },[scores]);
  if(!tally||tally.count===0)return null;
  return(
    <div style={{marginTop:8,padding:'10px 12px',background:'var(--cream)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:13,color:'var(--ink2)',lineHeight:1.7}}>
      You have predicted a total of <strong style={{color:'var(--ink)'}}>{tally.total} goals</strong> in {tally.count}/72 group stage matches. There are 31 matches in the knockout stages. Your total goals prediction is used as a tiebreaker. Individual shoot-out penalties do not count — refer to the rules section.
    </div>
  );
}

      const{data:finalMatch}=await sb.from('matches').select('id').eq('stage','final').single();

    setSaved(false);
  };
  const save=async()=>{
    setSaving(true);
    const{data:finalMatch}=await sb.from('matches').select('id').eq('stage','final').single();
    let championId=null;
    if(finalMatch){
      const{data:pick}=await sb.from('knockout_predictions').select('predicted_winner_id').eq('user_id',session.user.id).eq('match_id',finalMatch.id).maybeSingle();
      championId=pick?.predicted_winner_id||null;
    }
    await sb.from('special_predictions').upsert({
      user_id:session.user.id,champion_team_id:championId,
      top_scorer_name:form.top_scorer_name||null,
      top_assister_name:form.top_assister_name||null,
      total_goals:form.total_goals?parseInt(form.total_goals):null,
      penalty_shootouts:form.penalty_shootouts?parseInt(form.penalty_shootouts):null,
    },{onConflict:'user_id'});

  };
  if(loading)return <div className="loading">Loading...</div>;
  const iStyle={width:'100%',padding:'10px 12px',background:'var(--white)',border:'1px solid var(--border2)',borderRadius:'var(--r)',color:'var(--ink)',fontFamily:'var(--font-sans)',fontSize:14,outline:'none'};
  return(
    <div>
      <div className="info-box"><p>Each correct special prediction is worth <strong>10 points</strong>. All fields are locked before the tournament starts.</p></div>
      <div style={{maxWidth:480}}>
        <div className="field">
          <label>World Champion</label>
          <div style={{padding:'10px 12px',background:'var(--cream)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:14,color:champion?'var(--ink)':'var(--ink4)'}}>
            {champion?<span style={{display:'flex',alignItems:'center',gap:6}}><Flag name={champion.name}/>{champion.name}</span>:<span>Auto-set from your Final pick in the Knockout Stage</span>}
          </div>
        </div>
        <div className="field"><label>Top Scorer — player name</label><input type="text" value={form.top_scorer_name} onChange={e=>!locked&&setForm(f=>({...f,top_scorer_name:e.target.value}))} placeholder="e.g. Erling Haaland" style={iStyle} disabled={locked}/></div>
        <div className="field"><label>Top Assister — player name</label><input type="text" value={form.top_assister_name} onChange={e=>!locked&&setForm(f=>({...f,top_assister_name:e.target.value}))} placeholder="e.g. Kevin De Bruyne" style={iStyle} disabled={locked}/></div>
        <div className="field">
          <label>Total Goals in Tournament</label>

          <GoalsTally session={session} scores={groupScores}/>

        {!locked&&<div style={{display:'flex',alignItems:'center',gap:8,marginTop:8}}>
          <button className="btn btn-sm btn-outline" onClick={clearExtras}>Clear</button>
          <button className="btn btn-sm" onClick={save} disabled={saving}>{saving?'Saving...':'Save'}</button>

    </div>
  );
}

function LeaderboardTab({session,profile}){
  const[data,setData]=useState([]);
  const[loading,setLoading]=useState(true);
  const loadScores=()=>{
    setLoading(true);
    Promise.all([
      sb.from('scores').select('*,profiles(display_name)'),
      sb.from('special_predictions').select('user_id,total_goals'),
      sb.from('matches').select('actual_home_goals,actual_away_goals'),
      sb.from('app_settings').select('key,value').eq('key','actual_total_goals'),
    ]).then(([{data:sc},{data:sp},{data:m},{data:gs}])=>{
      const total=(m||[]).reduce((s,match)=>match.actual_home_goals!=null?s+match.actual_home_goals+match.actual_away_goals:s,0);
      const hasResults=(m||[]).some(match=>match.actual_home_goals!=null);
      const adminGoals=gs&&gs[0]?.value?parseInt(gs[0].value):null;
      const actualTotal=adminGoals||(hasResults?total:null);
      const sorted=(sc||[]).sort((a,b)=>{
        if(b.total_points!==a.total_points)return b.total_points-a.total_points;
        if(actualTotal==null)return 0;
        const spA=(sp||[]).find(s=>s.user_id===a.user_id);
        const spB=(sp||[]).find(s=>s.user_id===b.user_id);
        const diffA=spA?.total_goals!=null?Math.abs(spA.total_goals-actualTotal):9999;
        const diffB=spB?.total_goals!=null?Math.abs(spB.total_goals-actualTotal):9999;
        return diffA-diffB;
      });
      setData(sorted);setLoading(false);
    });
  };
  useEffect(()=>{loadScores();},[]);
  if(loading)return <div className="loading">Loading...</div>;
  return(
    <div>

      {data.length===0?(
        <div className="info-box"><p>No scores yet — the tournament has not started.</p></div>
      ):(
        <div className="lb-wrap">
          <table className="lb-table">
            <thead><tr><th>#</th><th>Player</th><th>Group Stage</th><th>Knockout</th><th>Specials</th><th>Total</th></tr></thead>
            <tbody>
              {data.map((row,i)=>(
                <tr key={row.user_id} className={row.user_id===session.user.id?'lb-you':''}>
                  <td><span className={`lb-rank${i===0?' top1':i===1?' top2':i===2?' top3':''}`}>{i+1}</span></td>
                  <td style={{fontWeight:500}}>{row.profiles?.display_name||'—'}{row.user_id===session.user.id&&<span className="badge badge-green" style={{marginLeft:8}}>You</span>}</td>
                  <td style={{color:'var(--ink3)',fontSize:13}}>{row.group_stage_points}</td>
                  <td style={{color:'var(--ink3)',fontSize:13}}>{row.knockout_points}</td>
                  <td style={{color:'var(--ink3)',fontSize:13}}>{row.special_points}</td>
                  <td><span className="lb-pts">{row.total_points}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function GroupScoresTab({session}){
  const[matches,setMatches]=useState([]);
  const[teams,setTeams]=useState({});
  const[profiles,setProfiles]=useState([]);
  const[allPreds,setAllPreds]=useState([]);
  const[userScores,setUserScores]=useState({});
  const[openMatch,setOpenMatch]=useState(null);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    Promise.all([
      sb.from('matches').select('*').eq('stage','group').order('match_number'),
      sb.from('teams').select('*'),
      sb.from('profiles').select('id,display_name').order('display_name'),
      sb.from('predictions').select('*'),
      sb.from('scores').select('*'),
    ]).then(([{data:m},{data:t},{data:pr},{data:p},{data:sc}])=>{
      setMatches(m||[]);
      const tMap={};(t||[]).forEach(team=>tMap[team.id]=team);setTeams(tMap);
      setProfiles(pr||[]);setAllPreds(p||[]);
      const sMap={};(sc||[]).forEach(s=>sMap[s.user_id]=s);setUserScores(sMap);
      setLoading(false);
    });
  },[]);
  if(loading)return <div className="loading">Loading...</div>;
  const byGroup={};
  matches.forEach(m=>{if(!byGroup[m.group_id])byGroup[m.group_id]=[];byGroup[m.group_id].push(m);});
  const sortedProfiles=[...profiles].sort((a,b)=>(userScores[b.id]?.total_points||0)-(userScores[a.id]?.total_points||0));

  const getResultClass=(pred,match)=>{
    if(!pred||pred.home==null||pred.away==null)return'no-pred';
    if(match.actual_home_goals==null)return'pending';
    if(pred.home===match.actual_home_goals&&pred.away===match.actual_away_goals)return'exact';
    const pr=pred.home>pred.away?'H':pred.home<pred.away?'A':'D';
    const ar=match.actual_home_goals>match.actual_away_goals?'H':match.actual_home_goals<match.actual_away_goals?'A':'D';
    return pr===ar?'correct':'wrong';
  };

  return(
    <div>
      {/* Legend */}
      <div style={{display:'flex',gap:16,marginBottom:'1.5rem',flexWrap:'wrap',fontSize:12,color:'var(--ink3)'}}>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'#2a5c3f',display:'inline-block'}}/> Exact score (3 pts)</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'#b87d2a',display:'inline-block'}}/> Correct result (1 pt)</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'#9e3a2a',display:'inline-block'}}/> Incorrect (0 pts)</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'var(--white)',border:'1px solid var(--border)',display:'inline-block'}}/> Pending result</span>
      </div>
      {GROUPS.map(g=>(
        <div key={g} className="group-section">
          <div className="group-title">Group {g}</div>
          {(byGroup[g]||[]).map(m=>{
            const home=teams[m.home_team_id],away=teams[m.away_team_id];
            const sched=MATCH_SCHEDULE[m.match_number]||{};
            const hasResult=m.actual_home_goals!=null&&m.actual_away_goals!=null;
            const isOpen=openMatch===m.id;
            const predMap={};
            allPreds.filter(p=>p.match_id===m.id).forEach(p=>{predMap[p.user_id]={home:p.predicted_home_goals,away:p.predicted_away_goals};});
            return(
              <div key={m.id} style={{marginBottom:2}}>
                {/* Match header row */}
                <div onClick={()=>setOpenMatch(isOpen?null:m.id)} style={{display:'grid',gridTemplateColumns:'1fr 120px 1fr 50px',alignItems:'center',padding:'10px 14px',background:'var(--white)',border:'1px solid var(--border)',borderRadius:isOpen?'var(--r) var(--r) 0 0':'var(--r)',cursor:'pointer',gap:8,userSelect:'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,fontWeight:500,color:'var(--ink)'}}>
                    <Flag name={home?.name} size={16}/>{home?.name}
                  </div>
                  <div style={{textAlign:'center',fontSize:11,color:'var(--ink3)'}}>
                    {hasResult
                      ? <span style={{fontFamily:'var(--font-serif)',fontSize:'1.2rem',fontWeight:600,color:'var(--ink)',letterSpacing:'1px'}}>{m.actual_home_goals} – {m.actual_away_goals}</span>
                      : <span style={{lineHeight:1.7}}>{sched.date}<br/>{sched.cet} CET · {sched.gmt} GMT</span>
                    }
                  </div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:6,fontSize:13,fontWeight:500,color:'var(--ink)'}}>
                    {away?.name}<Flag name={away?.name} size={16}/>
                  </div>
                  <span style={{fontSize:10,color:'var(--ink4)'}}>{isOpen?'▲':'▼'}</span>
                </div>
                {/* Expanded predictions */}
                {isOpen&&(
                  <div style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 var(--r) var(--r)',overflow:'hidden',marginBottom:4}}>
                    {/* Sub-header — 3 cols matching header layout */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 120px 1fr 50px',alignItems:'center',padding:'7px 14px',background:'var(--cream)',borderBottom:'1px solid var(--border)'}}>
                      <div style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)'}}>Predictions</div>
                      <div style={{textAlign:'center',fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)'}}>Predicted Score</div>
                      <div></div>
                      <div style={{textAlign:'center',fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)'}}>Pts</div>
                    </div>
                    {/* User rows */}
                    {sortedProfiles.map((pr,i)=>{

                      const cls=getResultClass(pred,m);
                      const bg=cls==='exact'?'#2a5c3f':cls==='correct'?'#b87d2a':cls==='wrong'?'#9e3a2a':'var(--white)';
                      const textCol=cls==='pending'||cls==='no-pred'?'var(--ink2)':'#ffffff';
                      const borderCol=cls==='pending'||cls==='no-pred'?'var(--border)':bg;
                      const pts=cls==='exact'?'+3':cls==='correct'?'+1':cls==='wrong'?'0':'';

                      return(

                          <div style={{fontSize:13,color:textCol,fontWeight:isYou?600:400}}>

                          </div>
                          <div style={{textAlign:'center',fontFamily:'var(--font-serif)',fontSize:'1rem',fontWeight:500,color:textCol}}>
                            {pred&&pred.home!=null?`${pred.home} – ${pred.away}`:'—'}
                          </div>
                          <div></div>
                          <div style={{textAlign:'center',fontSize:11,fontWeight:600,color:textCol,opacity:.8}}>
                            {pts}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function KnockoutScoresTab({session}){
  const[profiles,setProfiles]=useState([]);
  const[allKoPreds,setAllKoPreds]=useState([]);
  const[allGroupPreds,setAllGroupPreds]=useState([]);
  const[koMatches,setKoMatches]=useState([]);
  const[groupMatches,setGroupMatches]=useState([]);
  const[allTeams,setAllTeams]=useState([]);
  const[userScores,setUserScores]=useState({});
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    Promise.all([
      sb.from('profiles').select('id,display_name').order('display_name'),
      sb.from('knockout_predictions').select('*'),
      sb.from('predictions').select('*'),
      sb.from('matches').select('*').neq('stage','group').order('match_number'),
      sb.from('matches').select('*').eq('stage','group').order('match_number'),
      sb.from('teams').select('*'),
      sb.from('scores').select('*'),
    ]).then(([{data:pr},{data:kp},{data:gp},{data:km},{data:gm},{data:t},{data:sc}])=>{
      setProfiles(pr||[]);setAllKoPreds(kp||[]);setAllGroupPreds(gp||[]);
      setKoMatches(km||[]);setGroupMatches(gm||[]);setAllTeams(t||[]);
      const sMap={};(sc||[]).forEach(s=>sMap[s.user_id]=s);setUserScores(sMap);
      setLoading(false);
    });
  },[]);
  if(loading)return <div className="loading">Loading...</div>;

  const teamMap={};allTeams.forEach(t=>teamMap[t.id]=t);
  const sortedProfiles=[...profiles].sort((a,b)=>(userScores[b.id]?.total_points||0)-(userScores[a.id]?.total_points||0));
  const stages=['r32','r16','qf','sf','final'];

  // Get teams a user predicted for a stage
  const getUserPredictedTeams=(userId,stage)=>{
    const userGroupPreds=allGroupPreds.filter(p=>p.user_id===userId);
    const userPredMap={};
    userGroupPreds.forEach(p=>{userPredMap[p.match_id]={home:p.predicted_home_goals,away:p.predicted_away_goals};});
    const userKoPreds=allKoPreds.filter(p=>p.user_id===userId);
    const userKoMap={};
    userKoPreds.forEach(p=>{userKoMap[p.match_id]=p.predicted_winner_id;});
    // Build a map of which teams the user predicted to win each KO match
    // This lets us derive who enters each subsequent round
    const r32Matches=koMatches.filter(m=>m.stage==='r32');
    const r16Matches=koMatches.filter(m=>m.stage==='r16');
    const qfMatches=koMatches.filter(m=>m.stage==='qf');
    const sfMatches=koMatches.filter(m=>m.stage==='sf');

    // For R32: teams that qualified from group stage
    const{posMap,thirdSlots,standings:st}=deriveR32Teams(allTeams,groupMatches,userPredMap);
    const best8=GROUPS.map(g=>st[g]?.[2]).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8).map(t=>t.id);
    const qualGroups3=GROUPS.filter(g=>st[g]?.[2]&&best8.includes(st[g][2].id));
    const R32_IDX_MNUM={1:74,4:77,6:79,7:80,8:81,9:82,12:85,14:87};
    const r32pairs=R32_FIXED.map(([slotA,slotB],i)=>{
      const ru=(slot)=>{
        if(slot.type!=='3rd')return resolveSlot(slot,st,best8);
        const mn=R32_IDX_MNUM[i];if(!mn)return null;
        return resolveSlotFromLookup(mn,qualGroups3,st);
      };
      return{home:ru(slotA),away:ru(slotB),matchId:r32Matches[i]?.id};
    });

    if(stage==='r32'){
      const teams=new Set();
      r32pairs.forEach(({home,away})=>{if(home)teams.add(home);if(away)teams.add(away);});
      return teams;
    }

    // Helper: get winner of a KO match based on user's pick
    const getWinner=(matchId,homeId,awayId)=>{
      const p=userKoMap[matchId];
      return p===homeId?homeId:p===awayId?awayId:null;
    };

    // R16 entrants = winners of R32
    const r32Results=r32Matches.map((m,i)=>({
      matchId:m.id,
      home:r32pairs[i]?.home||null,
      away:r32pairs[i]?.away||null,
      winner:getWinner(m.id,r32pairs[i]?.home,r32pairs[i]?.away),
    }));

    if(stage==='r16'){
      const teams=new Set();
      r32Results.forEach(r=>{if(r.winner)teams.add(r.winner);});
      return teams;
    }

    // QF entrants = winners of R16
    const r16Results=r16Matches.map((m,i)=>{
      const a=r32Results[i*2],b=r32Results[i*2+1];
      const home=a?.winner||null,away=b?.winner||null;
      return{matchId:m.id,home,away,winner:getWinner(m.id,home,away)};
    });

    if(stage==='qf'){
      const teams=new Set();
      r16Results.forEach(r=>{if(r.winner)teams.add(r.winner);});
      return teams;
    }

    // SF entrants = winners of QF
    const qfResults=qfMatches.map((m,i)=>{
      const a=r16Results[i*2],b=r16Results[i*2+1];
      const home=a?.winner||null,away=b?.winner||null;
      return{matchId:m.id,home,away,winner:getWinner(m.id,home,away)};
    });

    if(stage==='sf'){
      const teams=new Set();
      qfResults.forEach(r=>{if(r.winner)teams.add(r.winner);});
      return teams;
    }

    // Final entrants = winners of SF
    const sfResults=sfMatches.map((m,i)=>{
      const a=qfResults[i*2],b=qfResults[i*2+1];
      const home=a?.winner||null,away=b?.winner||null;
      return{matchId:m.id,home,away,winner:getWinner(m.id,home,away)};
    });
    const teams=new Set();
    sfResults.forEach(r=>{if(r.winner)teams.add(r.winner);});
    return teams;
  };

  // Actual teams in each stage
  const actualTeamsInStage=(stage)=>{
    const s=new Set();
    koMatches.filter(m=>m.stage===stage).forEach(m=>{
      if(m.actual_home_team_id)s.add(m.actual_home_team_id);
      if(m.actual_away_team_id)s.add(m.actual_away_team_id);
    });
    return s;
  };

  return(
    <div>
      <div style={{display:'flex',gap:16,marginBottom:'1.5rem',flexWrap:'wrap',fontSize:12,color:'var(--ink3)'}}>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'#2a5c3f',display:'inline-block'}}/> Correct prediction</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:12,height:12,borderRadius:2,background:'var(--white)',border:'1px solid var(--border)',display:'inline-block'}}/> Predicted — result pending</span>
      </div>
      {stages.map(stage=>{
        const pts=STAGE_PTS[stage];
        const actualTeams=actualTeamsInStage(stage);
        const hasActual=actualTeams.size>0;
        const stageSize={r32:32,r16:16,qf:8,sf:4,final:2}[stage]||32;
        // Always show all stages
        return(
          <div key={stage} style={{marginBottom:'2.5rem'}}>
            <div className="group-title" style={{marginBottom:'1rem'}}>
              {STAGE_LABELS[stage]} <span style={{fontFamily:'var(--font-sans)',fontSize:11,color:'var(--ink4)',fontWeight:400}}>· {pts} pts per team advancing</span>
            </div>
            <div style={{border:'1px solid var(--border)',borderRadius:'var(--rl)',overflow:'hidden'}}>
              {/* Header row */}
              <div style={{display:'flex',alignItems:'center',padding:'8px 14px',background:'var(--cream)',borderBottom:'1px solid var(--border)'}}>
                <div style={{width:180,flexShrink:0,fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)'}}>
                  {hasActual?'Teams qualified':'Player'}
                </div>
                <div style={{flex:1,fontSize:10,color:'var(--ink4)',fontWeight:400}}>
                  {hasActual
                    ? <span style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        {[...actualTeams].sort((a,b)=>(teamMap[a]?.name||'').localeCompare(teamMap[b]?.name||'')).map(tid=>(
                          <Flag key={tid} name={teamMap[tid]?.name} size={16}/>
                        ))}
                      </span>
                    : <span style={{fontStyle:'italic',fontSize:11}}>Predicted picks — {stageSize} teams</span>
                  }
                </div>
                <div style={{width:50,flexShrink:0,textAlign:'right',fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',color:'var(--ink4)'}}>Pts</div>
              </div>
              {/* One row per user — flat list of their predicted flags */}
              {sortedProfiles.map((pr,i)=>{
                const predictedTeams=getUserPredictedTeams(pr.id,stage);
                const predictedArr=[...predictedTeams].sort((a,b)=>(teamMap[a]?.name||'').localeCompare(teamMap[b]?.name||''));
                const isYou=pr.id===session.user.id;
                const correctCount=predictedArr.filter(t=>actualTeams.has(t)).length;
                const ptsEarned=correctCount*pts;
                const isLast=i===sortedProfiles.length-1;
                return(
                  <div key={pr.id} style={{display:'flex',alignItems:'center',padding:'8px 14px',borderBottom:isLast?'none':'1px solid var(--border)',background:isYou?'#f7faf8':'var(--white)',gap:8}}>
                    <div style={{width:180,flexShrink:0,fontSize:13,fontWeight:isYou?600:400,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {pr.display_name}{isYou&&<span style={{fontSize:10,color:'var(--ink4)',marginLeft:5}}>you</span>}
                    </div>
                    <div style={{flex:1,display:'flex',gap:3,flexWrap:'wrap'}}>
                      {predictedArr.length===0
                        ? <span style={{fontSize:11,color:'var(--ink4)',fontStyle:'italic'}}>Predictions pending</span>
                        : predictedArr.map(tid=>{
                            const correct=hasActual&&actualTeams.has(tid);
                            const wrong=hasActual&&!actualTeams.has(tid);
                            return(
                              <span key={tid} style={{
                                display:'inline-flex',alignItems:'center',justifyContent:'center',
                                width:28,height:28,borderRadius:'50%',
                                background:correct?'#2a5c3f':wrong?'#fdf0f0':'var(--cream)',
                                border:`2px solid ${correct?'#2a5c3f':wrong?'#e8c5c4':'var(--border)'}`,
                                flexShrink:0,
                                transform:correct?'scale(1.15)':'scale(1)',
                                boxShadow:correct?'0 0 0 2px #e8f4ee':'none',
                              }} title={teamMap[tid]?.name}>
                                <Flag name={teamMap[tid]?.name} size={correct?18:15}/>
                              </span>
                            );
                          })
                      }
                    </div>
                    <div style={{width:50,flexShrink:0,textAlign:'right',fontSize:11,fontWeight:600,color:ptsEarned>0?'var(--green)':'var(--ink4)'}}>
                      {hasActual?(ptsEarned>0?`+${ptsEarned}`:'0'):''}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function AdminSpecials(){

                </td>
                <td>
                  <button className={`btn btn-sm${row.penalty_awarded?' btn-green':' btn-outline'}`} onClick={()=>toggleAward(row.user_id,'penalty_shootouts',row.penalty_awarded)} disabled={saving[row.user_id+'_penalty_shootouts']}>
                    {saving[row.user_id+'_penalty_shootouts']?'...':row.penalty_awarded?'Awarded':'Award 10 pts'}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PublishToggle(){
  const[published,setPublished]=useState(false);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  useEffect(()=>{
    sb.from('app_settings').select('value').eq('key','scores_published').maybeSingle().then(({data})=>{
      setPublished(data?.value==='true');setLoading(false);
    });
  },[]);
  const toggle=async()=>{
    setSaving(true);
    const newVal=!published;
    await sb.from('app_settings').upsert({key:'scores_published',value:String(newVal)},{onConflict:'key'});
    setPublished(newVal);setSaving(false);
  };
  if(loading)return null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:'1.5rem',padding:'12px 16px',background:'var(--white)',border:'1px solid var(--border)',borderRadius:'var(--rl)'}}>
      <div style={{flex:1}}>
        <div style={{fontSize:12,fontWeight:500,color:'var(--ink)',marginBottom:2}}>Scores & Predictions visible to all users</div>
        <div style={{fontSize:11,color:'var(--ink3)'}}>When published, all users can see everyone's predictions in the Scores & Leaderboard section.</div>
      </div>
      <button className={`btn btn-sm${published?' btn-green':' btn-outline'}`} onClick={toggle} disabled={saving}>
        {saving?'...':(published?'Published — click to hide':'Hidden — click to publish')}
      </button>
    </div>
  );
}




function AdminKnockoutBracket({allTeams,groupMatches,koMatches,actualGroupResults}){
  const[winners,setWinners]=useState({});
  const[saving2,setSaving2]=useState(false);
  const[saved,setSaved]=useState(false);
  const teamMap=useMemo(()=>{const m={};allTeams.forEach(t=>m[t.id]=t);return m;},[allTeams]);

  useEffect(()=>{
    const wMap={};
    koMatches.forEach(m=>{
      if(m.actual_home_team_id&&m.actual_away_team_id&&m.actual_home_goals!=null){
        const w=m.actual_home_goals>=m.actual_away_goals?m.actual_home_team_id:m.actual_away_team_id;
        wMap[m.id]=w;
      }
    });
    setWinners(wMap);
  },[koMatches]);

  const{posMap,thirdSlots,standings}=useMemo(()=>{
    if(!allTeams.length||!groupMatches.length)return{posMap:{},thirdSlots:{},standings:{}};
    return deriveR32Teams(allTeams,groupMatches,actualGroupResults);
  },[allTeams,groupMatches,actualGroupResults]);

  const best8thirds=useMemo(()=>{
    const allThirds=GROUPS.map(g=>standings[g]?.[2]).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
    return allThirds.slice(0,8).map(t=>t.id);
  },[standings]);

  const groupResultsCount=groupMatches.filter(m=>actualGroupResults[m.id]?.home!=null&&actualGroupResults[m.id]?.home!=='').length;
  const r32TeamPairs=useMemo(()=>{
    if(groupResultsCount<72)return R32_FIXED.map(([a,b])=>({home:null,away:null,homeLabel:a.label,awayLabel:b.label}));
    const qualifyingGroups2=GROUPS.filter(g=>standings[g]?.[2]&&best8thirds.includes(standings[g][2].id));
    const R32_IDX_TO_MATCHNUM2={1:74,4:77,6:79,7:80,8:81,9:82,12:85,14:87};
    return R32_FIXED.map(([slotA,slotB],idx)=>{
      const resolve=(slot)=>{
        if(slot.type!=='3rd')return resolveSlot(slot,standings,best8thirds);
        const matchNum=R32_IDX_TO_MATCHNUM2[idx];
        if(!matchNum)return null;
        return resolveSlotFromLookup(matchNum,qualifyingGroups2,standings);
      };
      return{home:resolve(slotA),away:resolve(slotB),homeLabel:slotA.label,awayLabel:slotB.label};
    });
  },[standings,best8thirds,groupResultsCount]);

  const derivedRounds=useMemo(()=>{
    const r32M=koMatches.filter(m=>m.stage==='r32');
    const r16M=koMatches.filter(m=>m.stage==='r16');
    const qfM=koMatches.filter(m=>m.stage==='qf');
    const sfM=koMatches.filter(m=>m.stage==='sf');
    const finM=koMatches.filter(m=>m.stage==='final');
    const gw=(mid,h,a)=>{const p=winners[mid];return p===h?h:p===a?a:null;};
    const r32=r32M.map((m,i)=>({matchId:m.id,matchNum:m.match_number,home:r32TeamPairs[i]?.home||null,away:r32TeamPairs[i]?.away||null,homeLabel:r32TeamPairs[i]?.homeLabel,awayLabel:r32TeamPairs[i]?.awayLabel}));
    const r16=r16M.map((m,i)=>{const a=r32[i*2],b=r32[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
    const qf=qfM.map((m,i)=>{const a=r16[i*2],b=r16[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
    const sf=sfM.map((m,i)=>{const a=qf[i*2],b=qf[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
    const fin=finM.map((m,i)=>{const a=sf[i*2],b=sf[i*2+1];return{matchId:m.id,matchNum:m.match_number,home:a?gw(a.matchId,a.home,a.away):null,away:b?gw(b.matchId,b.home,b.away):null};});
    return{r32,r16,qf,sf,final:fin};
  },[koMatches,r32TeamPairs,winners]);

  const pickWinner=(matchId,teamId)=>{
    setWinners(w=>({...w,[matchId]:w[matchId]===teamId?null:teamId}));
  };

  const saveKo=async()=>{
    setSaving2(true);
    const saves=[];
    for(const round of Object.values(derivedRounds)){
      for(const m of round){
        if(!m.home||!m.away)continue;
        const winner=winners[m.matchId];
        const update={actual_home_team_id:m.home,actual_away_team_id:m.away};
        if(winner){
          update.actual_home_goals=winner===m.home?1:0;
          update.actual_away_goals=winner===m.away?1:0;
        }
        saves.push(sb.from('matches').update(update).eq('id',m.matchId));
      }
    }
    await Promise.all(saves);
    setSaving2(false);
  };

  const groupResultsEntered=groupResultsCount;
  const rounds=[
    {key:'r32',label:'Round of 32',pts:2,matches:derivedRounds.r32},
    {key:'r16',label:'Round of 16',pts:4,matches:derivedRounds.r16},
    {key:'qf',label:'Quarter Finals',pts:6,matches:derivedRounds.qf},
    {key:'sf',label:'Semi Finals',pts:8,matches:derivedRounds.sf},
    {key:'final',label:'Final',pts:10,matches:derivedRounds.final},
  ];

  return(
    <div>
      {groupResultsEntered<72&&(
        <div className="info-box" style={{marginBottom:'1rem'}}>
          <p>Enter all 72 group stage results to auto-generate the R32 bracket. ({groupResultsEntered}/72 done)</p>
        </div>
      )}
      <div className="info-box" style={{marginBottom:'1.5rem'}}>
        <p>Click the winning team in each match to advance them. The bracket builds automatically. Save when done.</p>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:'1.5rem',alignItems:'center'}}>
        <button className="btn btn-sm" onClick={async()=>{setSaving2(true);await saveKo();await recalcAllScores();setSaved(true);setSaving2(false);setTimeout(()=>setSaved(false),3000);}} disabled={saving2}>{saving2?'Saving & updating...':'Save & update scores'}</button>
        {saved&&<span style={{fontSize:12,color:'var(--green)'}}>Saved & scores updated</span>}
      </div>
      <div className="bracket-wrap">
        <div className="bracket-tree">
          {rounds.map(({key,label,pts,matches})=>(
            <div key={key} className="bracket-col">
              <div className="bracket-col-header">{label} <span className="bracket-col-pts">({pts}p)</span></div>
              {matches.map(({matchId,matchNum,home,away,homeLabel,awayLabel})=>{
                const homeTeam=home?teamMap[home]:null;
                const awayTeam=away?teamMap[away]:null;
                const picked=winners[matchId];
                const bothKnown=!!home&&!!away;
                const sched=KO_SCHEDULE[matchNum]||{};
                return(
                  <div key={matchId} className="bracket-match-wrap">
                    <div className="bracket-match">
                      {sched.date&&<div className="bracket-match-label">Game {matchNum} · {sched.date} · {sched.cet} CET</div>}
                      {[[homeTeam,home,homeLabel],[awayTeam,away,awayLabel]].map(([team,id,label],ti)=>(
                        <div key={ti}
                          className={`bracket-team${!team?' tbd':''}${picked===id?' selected':''}${!bothKnown?' disabled':''}`}
                          onClick={()=>bothKnown&&pickWinner(matchId,id)}>
                          {team&&<span className="bracket-flag"><Flag name={team.name} size={16}/></span>}
                          <span className="bracket-name" style={{color:!team?'var(--ink4)':undefined,fontStyle:!team?'italic':undefined,fontSize:!team?'10px':undefined}}>
                            {team?team.name:label||'TBD'}
                          </span>
                          {picked===id&&<span className="bracket-winner-badge">Winner</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AdminPage(){
  const[tab,setTab]=useState('group');
  const[matches,setMatches]=useState([]);
  const[teams,setTeams]=useState({});
  const[results,setResults]=useState({});
  const[koTeams,setKoTeams]=useState({});
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[recalcing,setRecalcing]=useState(false);
  const[msg,setMsg]=useState('');
  const[lockOverride,setLockOverride]=useState(false);
  useEffect(()=>{
    Promise.all([sb.from('matches').select('*').order('match_number'),sb.from('teams').select('*')]).then(([{data:m},{data:t}])=>{
      setMatches(m||[]);
      const tMap={};(t||[]).forEach(team=>tMap[team.id]=team);setTeams(tMap);
      const rMap={},kMap={};
      (m||[]).forEach(match=>{
        if(match.actual_home_goals!=null)rMap[match.id]={home:match.actual_home_goals??'',away:match.actual_away_goals??''};
        if(match.stage!=='group')kMap[match.id]={home_id:match.actual_home_team_id||'',away_id:match.actual_away_team_id||''};
      });
      setResults(rMap);setKoTeams(kMap);setLoading(false);
    });
  },[]);
  const updateResult=(matchId,side,val)=>{
    if(side==='clear'){
      setResults(r=>({...r,[matchId]:{home:'',away:''}}));
      // Also clear from DB
      sb.from('matches').update({actual_home_goals:null,actual_away_goals:null}).eq('id',matchId).then(({error})=>{if(error)console.error('Clear result error:',error);});
      return;
    }
    const v=val===''?'':Math.max(0,parseInt(val)||0);
    setResults(r=>({...r,[matchId]:{...r[matchId],[side]:v}}));
  };
  const updateKoTeam=(matchId,side,val)=>{setKoTeams(k=>({...k,[matchId]:{...k[matchId],[side]:val?parseInt(val):''},}));};
  const saveAll=async()=>{
    setSaving(true);setMsg('');
    for(const[matchId,r]of Object.entries(results)){if(r.home!==''&&r.away!==''&&r.home!=null&&r.away!=null)await sb.from('matches').update({actual_home_goals:r.home,actual_away_goals:r.away}).eq('id',parseInt(matchId));}
    for(const[matchId,k]of Object.entries(koTeams)){const u={};if(k.home_id)u.actual_home_team_id=k.home_id;if(k.away_id)u.actual_away_team_id=k.away_id;if(Object.keys(u).length)await sb.from('matches').update(u).eq('id',parseInt(matchId));}
    setMsg('Results saved');setSaving(false);
  };
  const recalc=async()=>{setRecalcing(true);setMsg('');const n=await recalcAllScores();setMsg(`Scores recalculated for ${n} players`);setRecalcing(false);};
  if(loading)return <div className="loading">Loading...</div>;
  const groupMatches=matches.filter(m=>m.stage==='group');
  const koMatchList=matches.filter(m=>m.stage!=='group');
  const byGroup={};groupMatches.forEach(m=>{if(!byGroup[m.group_id])byGroup[m.group_id]=[];byGroup[m.group_id].push(m);});
  const byStage={};koMatchList.forEach(m=>{if(!byStage[m.stage])byStage[m.stage]=[];byStage[m.stage].push(m);});
  const filledCount=matches.filter(m=>results[m.id]?.home!==''&&results[m.id]?.away!==''&&results[m.id]?.home!=null&&results[m.id]?.away!=null).length;
  const teamOptions=Object.values(teams).sort((a,b)=>a.name.localeCompare(b.name));
  const selStyle={padding:'4px 8px',background:'var(--white)',border:'1px solid var(--border2)',borderRadius:'var(--r)',color:'var(--ink)',fontFamily:'var(--font-sans)',fontSize:12,outline:'none'};
  return(
    <div>
      <div className="page-header"><h1 className="page-title">Admin</h1><p className="page-sub">Enter results and manage the tournament</p></div>
      <div className="info-box" style={{marginBottom:'1.5rem'}}>
        <div style={{fontSize:13,color:'var(--ink2)',marginBottom:8}}>
          Deadline: June 10, 2026 23:59 Stockholm — <strong style={{color:isLocked()?'var(--red)':'var(--green)'}}>{isLocked()?'Locked':'Open'}</strong>
        </div>
        {isLocked()&&<button className={`btn btn-sm${lockOverride?' btn-green':' btn-outline'}`} style={{marginTop:4}} onClick={()=>setLockOverride(v=>!v)}>{lockOverride?'Predictions unlocked (admin override)':'Unlock predictions for editing'}</button>}
      </div>
      <PublishToggle/>
      <div style={{display:'flex',gap:10,marginBottom:'1.5rem',flexWrap:'wrap',alignItems:'center'}}>
        {tab==='group'&&<button className="btn btn-sm" onClick={async()=>{await saveAll();await recalc();}} disabled={saving||recalcing}>{(saving||recalcing)?'Saving...':'Save & update scores ('+filledCount+' entered)'}</button>}
        {tab==='knockout'&&<button className="btn btn-sm btn-outline" style={{color:'var(--red)',borderColor:'var(--red)'}} onClick={async()=>{if(!window.confirm('Clear all knockout bracket results?'))return;const ids=matches.filter(m=>m.stage!=='group').map(m=>m.id);for(const id of ids){await sb.from('matches').update({actual_home_team_id:null,actual_away_team_id:null,actual_home_goals:null,actual_away_goals:null}).eq('id',id);}setResults({});setKoTeams({});}}>Clear knockout results</button>}
        {msg&&<span style={{fontSize:12,color:'var(--green)'}}>{msg}</span>}
      </div>
      <div className="tabs">
        <button className={`tab${tab==='group'?' active':''}`} onClick={()=>setTab('group')}>Group Stage</button>
        <button className={`tab${tab==='knockout'?' active':''}`} onClick={()=>setTab('knockout')}>Knockout</button>
        <button className={`tab${tab==='specials'?' active':''}`} onClick={()=>setTab('specials')}>Extra Predictions</button>
      </div>
      {tab==='specials'&&<AdminSpecials/>}
      {tab==='group'&&GROUPS.map(g=>(
        <div key={g} className="group-section">
          <div className="group-title">Group {g}</div>
          {(byGroup[g]||[]).map(m=>{
            const home=teams[m.home_team_id],away=teams[m.away_team_id];
            const hasResult=results[m.id]?.home!==''&&results[m.id]?.away!==''&&results[m.id]?.home!=null&&results[m.id]?.away!=null;
            return(
              <div key={m.id} className={`admin-match${hasResult?' has-result':''}`}>
                <div className="admin-team"><Flag name={home?.name} size={14}/><span>{home?.name}</span></div>
                <input className="score-input" type="number" min="0" max="20" value={results[m.id]?.home??''} onChange={e=>updateResult(m.id,'home',e.target.value)} placeholder="—"/>
                <span className="match-vs">–</span>
                <input className="score-input" type="number" min="0" max="20" value={results[m.id]?.away??''} onChange={e=>updateResult(m.id,'away',e.target.value)} placeholder="—"/>
                <div className="admin-team away"><Flag name={away?.name} size={14}/><span>{away?.name}</span></div>
                {hasResult&&<button onClick={()=>updateResult(m.id,'clear','')} style={{marginLeft:4,flexShrink:0,padding:'2px 8px',fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',background:'transparent',border:'1px solid var(--border2)',borderRadius:'var(--r)',color:'var(--ink3)',cursor:'pointer'}} title="Clear result">✕</button>}
              </div>
            );
          })}
        </div>
      ))}
      {tab==='knockout'&&<AdminKnockoutBracket
        allTeams={Object.values(teams)}
        groupMatches={matches.filter(m=>m.stage==='group')}
        koMatches={matches.filter(m=>m.stage!=='group')}
        actualGroupResults={results}
      />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
